" y="111" width="172" height="4" rx="2" ry="2" fill="#e063ff" stroke="none" stroke-width="1.5"/><text x="635.0" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle" font-style="normal">LQR CONTROLLER</text><text x="635.0" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b95a8" text-anchor="middle" font-style="normal">feedback + feedforward</text><line x1="739" y1="150.0" x2="763" y2="150.0" stroke="#39414f" stroke-width="1.6"/><path d="M 761 145.0 L 771 150.0 L 761 155.0 Z" fill="#39414f"/><rect x="775" y="95" width="200" height="110" rx="10" ry="10" fill="#141a23" stroke="#ffc93d" stroke-width="1.8"/><rect x="789" y="111" width="172" height="4" rx="2" ry="2" fill="#ffc93d" stroke="none" stroke-width="1.5"/><text x="875.0" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle" font-style="normal">VEHICLE DYNAMICS</text><text x="875.0" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b95a8" text-anchor="middle" font-style="normal">nonlinear bicycle model</text><path d="M 875.0 205 C 875.0 245, 395.0 245, 395.0 205" fill="none" stroke="#39414f" stroke-width="1.6" stroke-dasharray="5,4"/><path d="M 395.0 207.0 L 392.3 200.6 L 397.7 200.6 Z" fill="#39414f"/><text x="500.0" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b95a8" text-anchor="middle" font-style="italic">estimate feeds back into the filter every step</text><text x="40" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start" font-style="